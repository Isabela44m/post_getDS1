<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title> Consultar filme</title>
        <meta charset="UTF-8"/>
        <link rel="stylesheet" href="../css/get.css"/>
        <script src="../js/get.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Lista de filmes </h1>
            <p>Prática com o método Get: buscar e exibir os filmes da  API do codeverse</p>
        </header>
        <main>
            <a href="../index.html"> Ir para o cadastro </a>
            <section id="conteiner-titulo-lista">
                <h2 id="titulo-lista">Filmes cadastrados</h2>
                <p>Os  filmes são cadastrados automaticamente</p>
                <p id="resposta"></p>
                <ul id="lista-filmes"></ul>
            </section>
            <template id="modelo-filme">
                <li>
                    <section class="card-capa">
                        <img alt=""/>
                    </section>
                    <section class="card-counteudo">
                        <h3 class="nome"></h3>
                        <p><strong>Gênero:</strong> <span class="genero"></span></p>
                        <p><strong>Ano:</strong> <span class="ano"></span></p>
                        <p><strong>Diretor:</strong> <span class="diretor"></span></p>
                        <p><strong>Nota:</strong> <span class="nota"></span></p>
                    </section>
                </li>

            </template>

        </main>
    </body>
</html>
